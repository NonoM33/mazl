<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MAZL Staff — maquette</title>
<link rel="stylesheet" href="maquette.css">
</head>
<body>
<!-- Maquette statique de design (données fictives). Écrans : ?s=dashboard | reports | algo | login -->
<div id="root"></div>
<script>
const I = {
  home: '<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/>',
  flag: '<path d="M5 21V4h11l-1.5 4L16 12H5"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.8 3 2.6 3.5 5.2"/>',
  scale: '<path d="M12 3v18M5 21h14M4 7h16"/><path d="m4 7-2.5 6a3 3 0 0 0 5 0zM20 7l-2.5 6a3 3 0 0 0 5 0z"/>',
  check: '<path d="M12 3 4.5 6v6c0 4.5 3.2 7.8 7.5 9 4.3-1.2 7.5-4.5 7.5-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  gavel: '<path d="M4 20h10M14.5 4.5l5 5M12 7l5 5M9.5 9.5 4 15l2 2 5.5-5.5"/>',
  sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  log: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/>',
  team: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  msg: '<path d="M4 5h16v11H9l-5 4z"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;

function side(active) {
  const items = [
    ['dashboard','home','Tableau de bord'], ['reports','flag','Signalements','12',true], ['members','users','Membres'],
    ['appeals','scale','Contestations','3'], ['verif','check','Vérification','7'], ['auth','gavel','Autorités'],
  ];
  const items2 = [['algo','sliders','Algorithme'], ['audit','log','Journal d’audit'], ['transparency','chart','Transparence'], ['team','team','Équipe']];
  const link = ([id, ic, label, count, hot]) => `<a href="?s=${id}" class="${id===active?'on':''}">${svg(ic)}${label}${count?`<span class="count ${hot?'hot':''}">${count}</span>`:''}</a>`;
  return `<aside class="side">
    <div class="brand"><span class="wordmark">mazl<i>.</i></span><span class="eyebrow" style="padding:0;margin:0;color:#6E6E78">Staff</span></div>
    <div><div class="eyebrow">Confiance &amp; sécurité</div><nav class="nav">${items.map(link).join('')}</nav></div>
    <div><div class="eyebrow">Produit &amp; conformité</div><nav class="nav">${items2.map(link).join('')}</nav></div>
    <div class="me"><div class="avatar">RC</div><div><b>Renaud C.</b><span>Super-admin · 2FA actif</span></div></div>
  </aside>`;
}

function chart() {
  const rec = [14,11,16,13,18,12,9,15,17,22,19,14,12,16,21,18,15,13,17,24,20,16,14,19,23,18,16,21,17,15];
  const han = [12,12,14,13,15,13,10,13,16,18,20,15,12,15,18,19,15,13,16,20,21,17,14,17,21,19,16,19,18,16];
  const W=640,H=300,mx=26, max=28, x=(i)=>mx+i*(W-mx-6)/29, y=(v)=>H-22-v/max*(H-36);
  const path=(a)=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const grid=[0,10,20].map(v=>`<line x1="${mx}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#EDEDF0"/><text x="0" y="${y(v)+4}" font-size="10" fill="#8A8A94" font-family="GeistMono">${v}</text>`).join('');
  const days=['26 sept.','3 oct.','10 oct.','17 oct.','24 oct.'].map((d,k)=>`<text x="${x(k*7.25)}" y="${H-4}" font-size="10" fill="#8A8A94" font-family="GeistMono" text-anchor="${k===4?'end':'middle'}">${d}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><title>Signalements reçus et traités sur 30 jours</title>${grid}${days}
    <path d="${path(rec)}L${x(29)},${y(0)}L${x(0)},${y(0)}Z" fill="#2747F5" opacity=".06"/>
    <path d="${path(rec)}" fill="none" stroke="#2747F5" stroke-width="2"/>
    <path d="${path(han)}" fill="none" stroke="#0B0B0F" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="${x(29)}" cy="${y(15)}" r="4" fill="#2747F5" stroke="#fff" stroke-width="2"/></svg>`;
}

const screens = {
dashboard: () => `<div class="app">${side('dashboard')}<main>
  <div class="top"><div><div class="eyebrow">Vendredi 24 octobre · mis à jour il y a 2 min</div><h1>Tableau de bord</h1></div>
  <div style="display:flex;gap:8px"><span class="seg"><span>7 j</span><span class="on">30 j</span><span>90 j</span></span><button class="btn">${svg('download')}Rapport de transparence</button></div></div>
  <div class="stats">
    <div class="card stat"><div class="eyebrow">Ouverts</div><div class="v">12</div><div class="d">dont 2 en P1</div></div>
    <div class="card stat"><div class="eyebrow">En retard</div><div class="v" style="color:var(--error)">3</div><div class="d bad">délai dépassé</div></div>
    <div class="card stat"><div class="eyebrow">Délai médian</div><div class="v">5 h 40</div><div class="d good">−1 h 10 vs 30 j préc.</div></div>
    <div class="card stat"><div class="eyebrow">Contestations</div><div class="v">3</div><div class="d">12 % annulées</div></div>
    <div class="card stat"><div class="eyebrow">Vérifications</div><div class="v">7</div><div class="d">en attente de revue</div></div>
    <div class="card stat"><div class="eyebrow">Actifs 7 j</div><div class="v">1 284</div><div class="d good">+6 %</div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="card-h"><h2>Signalements, 30 jours</h2><div class="legend"><span><i style="background:#2747F5"></i>Reçus</span><span><i style="background:#0B0B0F"></i>Traités</span></div></div>${chart()}</div>
    <div class="card"><div class="card-h"><h2>File ouverte par priorité</h2><span class="muted mono">12</span></div>
      <div class="bars">
        <div class="bar-row"><span class="prio p1">P1 · 4 h</span><div class="bar"><span style="width:17%;background:var(--error)"></span></div><b>2</b></div>
        <div class="bar-row"><span class="prio p2">P2 · 24 h</span><div class="bar"><span style="width:33%;background:var(--warning)"></span></div><b>4</b></div>
        <div class="bar-row"><span class="prio p3">P3 · 72 h</span><div class="bar"><span style="width:42%;background:var(--tekhelet)"></span></div><b>5</b></div>
        <div class="bar-row"><span class="prio p4">P4 · 7 j</span><div class="bar"><span style="width:8%;background:var(--faint)"></span></div><b>1</b></div>
      </div>
      <div style="margin-top:22px" class="card-h"><h2>Motifs, 30 jours</h2></div>
      <div class="bars">
        ${[['Faux profil',38],['Harcèlement',21],['Arnaque',14],['Photos',12],['Mineur présumé',3]].map(([l,v])=>`<div class="bar-row" style="grid-template-columns:110px 1fr 32px"><span>${l}</span><div class="bar"><span style="width:${v*2.2}%;background:var(--ink)"></span></div><b>${v}</b></div>`).join('')}
      </div></div>
  </div>
  <div class="grid3">
    <div class="card"><div class="card-h"><h2>Sanctions, 30 j</h2></div><div class="bars">
      ${[['Avertissement',18],['Restriction',9],['Suspension',6],['Bannissement',4]].map(([l,v])=>`<div class="bar-row"><span>${l}</span><div class="bar"><span style="width:${v*5}%;background:var(--ink)"></span></div><b>${v}</b></div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><h2>Membres</h2></div>
      <div class="facts" style="grid-template-columns:1fr 1fr"><div><b>4 912</b><span>inscrits</span></div><div><b>+146</b><span>nouveaux 7 j</span></div><div><b>612</b><span>matchs 7 j</span></div><div><b>2 087</b><span>vérifiés</span></div></div></div>
    <div class="card"><div class="card-h"><h2>Algorithme</h2><span class="tag blue">v14 active</span></div>
      <p class="muted" style="font-size:13px">Test A/B en cours : <b style="color:var(--ink)">v15</b> sur 20 % des membres depuis 3 jours.</p>
      <div class="facts" style="grid-template-columns:1fr 1fr;margin-top:12px"><div><b>4,1 %</b><span>taux de match v14</span></div><div><b style="color:var(--success)">4,6 %</b><span>taux de match v15</span></div></div></div>
  </div>
</main></div>`,

reports: () => {
  const rows = [
    ['P1','p1','Mineur présumé','Lina M.','#5512 · nouvelle','il y a 1 h','dans 3 h',false,'—',0,true],
    ['P1','p1','Hors application','Yoni B.','#4410 · vérifié','il y a 6 h','retard 2 h',true,'moi',1],
    ['P2','p2','Arnaque','Daniel K.','#5389 · 4 j','il y a 9 h','dans 15 h',false,'—',3, false, true],
    ['P2','p2','Harcèlement','Ethan S.','#3301 · selfie','il y a 20 h','retard 1 h',true,'Sarah L.',0],
    ['P2','p2','Arnaque','Maya R.','#5490 · 9 j','il y a 21 h','dans 3 h',false,'—',1],
    ['P3','p3','Faux profil','Noa T.','#5233 · 3 sem.','il y a 1 j','dans 2 j',false,'—',2],
    ['P3','p3','Photos','Ariel G.','#2876 · identité','il y a 1 j','dans 2 j',false,'moi',0],
    ['P3','p3','Faux profil','Sacha D.','#5501 · 2 j','il y a 2 j','retard 4 h',true,'—',0],
    ['P4','p4','Spam','Léa F.','#4122 · selfie','il y a 3 j','dans 4 j',false,'—',0],
  ];
  return `<div class="app">${side('reports')}<main><div class="split"><div class="list">
  <div class="top"><div><div class="eyebrow">Confiance &amp; sécurité</div><h1>Signalements</h1><div class="sub">12 ouverts · 3 en retard · triés par priorité puis échéance</div></div>
    <div style="display:flex;gap:8px"><button class="btn">${svg('download')}Exporter</button></div></div>
  <div class="filters"><span class="seg"><span class="on">Ouverts</span><span>En revue</span><span>Traités</span><span>Classés</span></span>
    <span class="chip"><b>Priorité</b> Toutes</span><span class="chip"><b>Assignés</b> Tous</span><span class="chip"><b>Motif</b> Tous</span>
    <span class="search">${svg('search').replace('<svg','<svg width="14" height="14" stroke="currentColor" fill="none" stroke-width="1.6"')} Rechercher un membre</span></div>
  <table><thead><tr><th>Priorité</th><th>Membre signalé</th><th>Motif</th><th>Reçu</th><th>Échéance</th><th>Assigné</th><th>Autres</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r[11]?'sel':''}"><td><span class="prio ${r[1]}">${r[0]}</span></td><td><div class="who"><span class="thumb"></span><div><b>${r[3]}</b><small>${r[4]}</small></div></div></td><td>${r[2]}</td><td class="muted">${r[5]}</td><td class="${r[7]?'late':''}">${r[6]}</td><td>${r[8]==='moi'?'<span class="tag blue">moi</span>':r[8]==='—'?'<span class="muted">—</span>':r[8]}</td><td>${r[9]?`<span class="tag">${r[9]}</span>`:'<span class="muted">0</span>'}</td></tr>`).join('')}
  </tbody></table>
  <p class="muted mono" style="margin-top:14px">j / k pour naviguer · Entrée pour ouvrir · Échap pour fermer</p>
  </div>
  <aside class="drawer">
    <div class="head"><div><span class="prio p2">P2 · ARNAQUE</span><h2>Daniel K. <span class="muted" style="font-weight:400">#5389</span></h2><div class="muted" style="font-size:13px">Signalé il y a 9 h par un membre · échéance dans 15 h</div></div><button class="btn sm" aria-label="Fermer">${svg('x')}</button></div>
    <div class="section"><span class="eyebrow">Ce que dit le signaleur</span><div class="quote">« Il m’a demandé de passer sur WhatsApp au bout de 10 minutes, puis de l’aider pour un virement bloqué. »</div></div>
    <div class="section"><span class="eyebrow">Message signalé</span><div class="quote msg">« Je suis coincé à l’étranger, ma banque bloque mon compte. Tu peux m’avancer 400 € par Transcash ? Je te rembourse lundi. »<div class="muted mono" style="margin-top:6px">mardi 22 oct. · 21:14</div></div></div>
    <div class="section"><span class="eyebrow">Signaux de risque — indices, jamais une preuve</span><div class="signals">
      <div class="signal">${svg('alert')}<span>4 messages évoquent de l’argent ou un virement</span><span class="meter"><span style="width:90%"></span></span></div>
      <div class="signal">${svg('alert')}<span>3 messages renvoient vers une messagerie externe</span><span class="meter"><span style="width:70%"></span></span></div>
      <div class="signal">${svg('alert')}<span>Même message envoyé à 5 conversations</span><span class="meter"><span style="width:60%"></span></span></div>
      <div class="signal">${svg('alert')}<span>Compte de 4 jours, non vérifié</span><span class="meter"><span style="width:40%"></span></span></div></div></div>
    <div class="facts"><div><b>3</b><span>autres signalements</span></div><div><b>2</b><span>blocages reçus</span></div><div><b>0</b><span>sanction</span></div><div><b>4 j</b><span>ancienneté</span></div></div>
    <div class="suggest"><div><span class="eyebrow" style="color:var(--tekhelet)">Sanction suggérée</span><div style="font-weight:600;margin-top:2px">Suspension en attendant une vérification d’identité</div></div><span class="muted" style="font-size:12px;max-width:120px;text-align:right">Suggestion : la décision reste humaine</span></div>
    <button class="btn wrap">${svg('msg')}<span><b style="font-weight:500">Lire la conversation</b><br><span class="muted" style="font-size:12px">Un motif est demandé, la consultation est journalisée</span></span></button>
    <div class="actions"><button class="btn">Classer sans suite</button><button class="btn">M’assigner</button><button class="btn ink">Décider…</button></div>
  </aside></div></main></div>`;
},

algo: () => {
  const sl = (label, val, pct, base, changed) => `<div class="slider"><label>${label}</label><span class="val ${changed?'changed':''}">${val}</span><div class="track"><span class="${changed?'changed':''}" style="width:${pct}%"></span>${changed?`<em style="left:${base}%"></em>`:''}<i class="${changed?'changed':''}" style="left:${pct}%"></i></div></div>`;
  const ranks = [
    [1,'Sarah','Paris 17e · 31 ans · Massorti','0,82','▲ 3','up'],
    [2,'Myriam','Neuilly · 29 ans · Traditionaliste','0,79','▲ 1','up'],
    [3,'Déborah','Paris 16e · 33 ans · Orthodoxe moderne','0,74','▼ 2','down',true],
    [4,'Esther','Levallois · 30 ans · Massorti','0,71','=',''],
    [5,'Rachel','Vincennes · 28 ans · Traditionaliste','0,66','▲ 4','up'],
    [6,'Hannah','Boulogne · 34 ans · Libéral','0,61','▼ 3','down'],
    [7,'Tamar','Sarcelles · 27 ans · Massorti','0,58','=','',false,true],
    [8,'Judith','Créteil · 32 ans · Orthodoxe','0,55','▼ 1','down'],
  ];
  return `<div class="app">${side('algo')}<main>
  <div class="top"><div><div class="eyebrow">Produit · moteur de recommandation</div><h1>Algorithme de match</h1><div class="sub">Chaque réglage se prévisualise sur une population synthétique : aucune donnée de membre n’est utilisée.</div></div>
    <div style="display:flex;gap:8px"><button class="btn">Historique des versions</button><button class="btn">Comparer A/B</button></div></div>
  <div class="versionbar"><span class="dot"></span><b>v14 active</b><span class="mono">publiée par Renaud C. le 18 oct. · « Plus de poids au chabbat »</span><span style="margin-left:auto" class="mono">3 modifications non publiées</span><button class="btn ghost">${svg('undo')}Annuler</button><button class="btn primary">Publier v15…</button></div>
  <div class="tune">
    <div class="panel">
      <div class="card line group"><div class="eyebrow"><span>Poids des critères</span><span>0 – 10</span></div>
        ${sl('Courant','6',60,60)}${sl('Cashrout','4',40,40)}${sl('Chabbat','6',60,40,true)}${sl('Intention','5',50,50)}${sl('Âge','3',30,30)}${sl('Distance','2,5',25,40,true)}${sl('Profil complet','2',20,20)}${sl('Vérification','3',30,20,true)}</div>
      <div class="card line group"><div class="eyebrow"><span>Équité &amp; fraîcheur</span></div>
        ${sl('Demi-vie d’inactivité','14 j',15,15)}${sl('Bonus nouveaux','+20 %',20,20)}${sl('Effet d’un boost (plafond ×2)','×1,5',50,50)}${sl('Limite de surexposition','60 likes',11,11)}${sl('Part d’exploration','10 %',33,33)}</div>
      <div class="card line group"><div class="eyebrow"><span>Réciprocité</span></div>
        <div class="seg" style="width:100%;margin-top:6px"><span class="on" style="flex:1;text-align:center">Harmonique</span><span style="flex:1;text-align:center">Géométrique</span><span style="flex:1;text-align:center">Minimum</span></div>
        <p class="muted" style="font-size:12px;margin-top:8px">Un profil n’est bien classé que si l’intérêt est probable dans les deux sens.</p></div>
    </div>
    <div>
      <div class="card line">
        <div class="card-h"><div class="viewer"><span class="thumb" style="width:40px;height:40px;border-radius:12px"></span><div><span class="eyebrow muted">Profil test synthétique</span><div style="font-weight:600">David, 32 ans · Paris 17e · Massorti · cacher à la maison · chabbat en famille · cherche le mariage</div></div></div><button class="btn sm">Changer de profil</button></div>
        <div class="rank" style="padding-top:0;padding-bottom:6px"><span class="eyebrow muted">#</span><span></span><span class="eyebrow muted">Candidate</span><span class="eyebrow muted">Score</span><span class="eyebrow muted">vs v14</span><span></span></div>
        ${ranks.map(r=>`<div class="rank ${r[6]?'open':''}"><span class="n">${String(r[0]).padStart(2,'0')}</span><span class="thumb"></span><div><b style="font-weight:500">${r[1]}</b>${r[7]?'<span class="explore">EXPLORATION</span>':''}<div class="muted" style="font-size:12px">${r[2]}</div></div><div style="display:flex;align-items:center;gap:8px"><div class="scorebar" style="flex:1"><span style="width:${parseFloat(r[3].replace(',','.'))*100}%"></span></div><span class="mono">${r[3]}</span></div><span class="mv ${r[5]}">${r[4]}</span><span class="muted" style="font-size:12px">${r[6]?'▾':'▸'}</span></div>
        ${r[6]?`<div class="explain"><div class="card-h" style="margin-bottom:8px"><b>Pourquoi Déborah est 3ᵉ</b><span class="mono muted">réciprocité 0,77 · David → Déborah 0,81 · Déborah → David 0,73</span></div>
          ${[['Courant',0.67,'Massorti · Orthodoxe moderne : écart de 1','.14'],['Cashrout',0.5,'À la maison · Strict : écart de 1','.06'],['Chabbat',0.5,'En famille · Observant : écart de 1','.09'],['Intention',1,'Mariage · Mariage : même rang','.16'],['Âge',0.93,'33 ans dans 27–36','.09'],['Distance',0.83,'5 km','.07'],['Profil complet',0.92,'4 photos, bio, 3 questions','.06'],['Vérification',1,'Identité vérifiée','.10']].map(([l,s,d,c])=>`<div class="contrib"><span>${l}</span><div class="bar"><span style="width:${s*100}%"></span></div><span class="muted">${d}</span><span class="mono" style="text-align:right">+${c}</span></div>`).join('')}
          <div class="mults"><span class="tag">Actif il y a 1 j ×0,95</span><span class="tag">Compte établi ×1</span><span class="tag">Pas de boost ×1</span><span class="tag">74 likes en 7 j ×0,89</span><span class="tag ok">0 signalement ×1</span></div>
          <div class="formula">score = 0,77 (réciprocité) × 0,95 × 1 × 1 × 0,89 × 1 = 0,74</div></div>`:''}`).join('')}
      </div>
    </div>
  </div>
</main></div>`;
},

login: () => `<div class="login"><div class="left"><span class="wordmark">mazl<i style="color:var(--tekhelet);font-style:normal">.</i></span>
  <div><div class="eyebrow" style="color:#6E6E78;margin-bottom:14px">Espace staff</div><h1 style="font-size:44px;letter-spacing:-2px;color:#fff">Protéger les rencontres,<br>une décision à la fois.</h1><p style="margin-top:16px">Accès réservé à l’équipe MAZL. Chaque action est journalisée.</p></div>
  <span class="mono" style="color:#6E6E78">Second facteur obligatoire</span></div>
  <div class="right"><form>
    <div class="eyebrow muted">Étape 2 sur 2</div><h1 style="font-size:28px;letter-spacing:-1px">Code de vérification</h1>

    <button type="button" class="btn primary" style="height:44px;justify-content:center">Vérifier</button>
    <span class="muted" style="font-size:13px">Connecté en tant que renaud@… · <a href="#" style="color:var(--tekhelet)">changer de compte</a></span>
  </form></div></div>`,
};
const s = new URLSearchParams(location.search).get('s') || 'dashboard';
document.getElementById('root').innerHTML = (screens[s] || screens.dashboard)();
</script>
</body>
</html>
