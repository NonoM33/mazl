<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>MAZL sur iPhone Duo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; opacity: 0; transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
  #stage canvas.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #stage canvas { transition: none; } }
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<!-- Scripts classiques : un module ES chargé depuis file:// est refusé par WKWebView. -->

<script src="pose_math.js"></script>
<script src="tutorial.js"></script>
</body>
