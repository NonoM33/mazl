<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mazl. Ancienne console</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @font-face { font-family: "Geist"; font-weight: 400; font-style: normal; font-display: swap; src: url("/console/fonts/Geist-400.ttf") format("truetype"); }
    @font-face { font-family: "Geist"; font-weight: 500; font-style: normal; font-display: swap; src: url("/console/fonts/Geist-500.ttf") format("truetype"); }
    @font-face { font-family: "Geist"; font-weight: 600; font-style: normal; font-display: swap; src: url("/console/fonts/Geist-600.ttf") format("truetype"); }
    @font-face { font-family: "Geist"; font-weight: 700; font-style: normal; font-display: swap; src: url("/console/fonts/Geist-700.ttf") format("truetype"); }
    @font-face { font-family: "Geist Mono"; font-weight: 500; font-style: normal; font-display: swap; src: url("/console/fonts/GeistMono-500.ttf") format("truetype"); }
    @font-face { font-family: "Geist Mono"; font-weight: 400; font-style: normal; font-display: swap; src: url("/console/fonts/GeistMono-400.ttf") format("truetype"); }
    :root {
      --ink: #0B0B0F;
      --paper: #FFFFFF;
      --tekhelet: #2747F5;
      --tekhelet-dark: #1A35C9;
      --tekhelet-light: #5B78FF;
      --mist: #F3F3F5;
      --hairline: #E2E2E6;
      --muted: #6B6B76;
      --error: #C8281C;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: var(--mist);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 14px;
      padding: 32px;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.055em; line-height: 0.95; }
    .admin-badge {
      font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--hairline); border-radius: 4px; padding: 2px 6px;
    }
    .title { margin-top: 24px; font-size: 24px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.15; }
    .subtitle { margin: 6px 0 24px; font-size: 14px; color: var(--muted); line-height: 1.5; }
    .google-btn, .submit-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; height: 44px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background-color 150ms, border-color 150ms;
    }
    .google-btn { background: var(--paper); border: 1px solid var(--hairline); color: var(--ink); }
    .google-btn:hover:not(:disabled) { background: var(--mist); }
    .google-btn svg { width: 18px; height: 18px; }
    .submit-btn { background: var(--tekhelet); border: 1px solid transparent; color: #fff; margin-top: 8px; }
    .submit-btn:hover:not(:disabled) { background: var(--tekhelet-dark); }
    .google-btn:disabled, .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .divider {
      display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--muted); font-size: 12px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .form-input {
      width: 100%; height: 42px; padding: 0 12px; font: inherit; font-size: 14px; color: var(--ink);
      background: var(--paper); border: 1px solid var(--hairline); border-radius: 10px; outline: none;
    }
    .form-input:focus { border-color: var(--tekhelet); box-shadow: 0 0 0 3px rgba(39, 71, 245, 0.15); }
    .error-msg {
      display: none; margin-top: 16px; padding: 10px 12px; font-size: 13px;
      color: var(--error); background: #FBE9E7; border-radius: 10px;
    }
    .error-msg.show { display: block; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.4); border-top-color: currentColor;
      border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block;
    }
    .google-btn .spinner { border-color: var(--hairline); border-top-color: var(--tekhelet); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note { margin-top: 24px; text-align: center; font-size: 13px; }
    .page-note { margin-top: 20px; text-align: center; font-size: 12.5px; color: var(--muted); }
    .shell { width: 100%; max-width: 400px; }
    .footer-note a { color: var(--tekhelet); text-decoration: none; }
    .footer-note a:hover { color: var(--tekhelet-dark); text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #F4F4F5; --paper: #141418; --mist: #0B0B0F; --hairline: #26262C; --muted: #A1A1AA; --tekhelet: #5B78FF; --tekhelet-dark: #7A91FF; --error: #F0766B; }
      .error-msg { background: #3A1815; }
      .submit-btn { color: #0B0B0F; }
    }
  </style>
</head>
<body>
  <main class="shell">
  <div class="login-card">
    <div class="brand">
      <span class="logo" aria-label="mazl">mazl.</span>
      <span class="admin-badge">Staff</span>
    </div>
    <h1 class="title">Connexion à l'ancienne console</h1>
    <p class="subtitle">Événements, campagnes et abonnements, en attendant leur arrivée dans la nouvelle console.</p>

    <button class="google-btn" id="google-btn" onclick="handleGoogleLogin()">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuer avec Google
    </button>

    <div class="divider">ou</div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="admin@mazl.app" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Se connecter</button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <p class="footer-note"><a href="/console">Retour à la nouvelle console</a></p>
  </div>
  <p class="page-note">Accès réservé à l'équipe MAZL.</p>
  </main>

  <script>
    const STORAGE_KEY = 'mazl_admin_token';
    const EMAIL_KEY = 'mazl_admin_email';
    const GOOGLE_CLIENT_ID = '114247778518-1bkjnb262ljaklg7pie1som74tedpt79.apps.googleusercontent.com';

    // Initialize Google Sign-In
    function initGoogleSignIn() {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredential,
          auto_select: false,
        });
      }
    }

    // Wait for Google library to load
    window.onload = () => {
      initGoogleSignIn();
      checkExistingSession();
    };

    function handleGoogleLogin() {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.prompt((notification) => {
          if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
            // Fallback: use popup
            google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: 'email profile',
              callback: (response) => {
                if (response.access_token) {
                  // The server checks the access token with Google itself.
                  loginWithGoogle({ accessToken: response.access_token });
                }
              },
            }).requestAccessToken();
          }
        });
      } else {
        showError('Google Sign-In non disponible. Rechargez la page.');
      }
    }

    async function handleGoogleCredential(response) {
      await loginWithGoogle({ idToken: response.credential });
    }

    async function loginWithGoogle(googleProof) {
      const btn = document.getElementById('google-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Connexion...';

      try {
        const res = await fetch('/api/admin/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(googleProof),
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Connexion refusee');
        }

        localStorage.setItem(STORAGE_KEY, data.token);
        localStorage.setItem(EMAIL_KEY, data.email);
        window.location.href = '/admin/dashboard';

      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continuer avec Google
        `;
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('error-msg');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function hideError() {
      document.getElementById('error-msg').classList.remove('show');
    }

    // Password login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Connexion...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Identifiants incorrects');
        }

        localStorage.setItem(STORAGE_KEY, data.token);
        localStorage.setItem(EMAIL_KEY, email);
        window.location.href = '/admin/dashboard';

      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });

    // Check existing session
    async function checkExistingSession() {
      const token = localStorage.getItem(STORAGE_KEY);
      if (!token) return;

      try {
        const res = await fetch('/api/admin/verify', {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        if (res.ok) {
          window.location.href = '/admin/dashboard';
        } else {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(EMAIL_KEY);
        }
      } catch (e) {
        // Stay on login page
      }
    }
  </script>
</body>
</html>
